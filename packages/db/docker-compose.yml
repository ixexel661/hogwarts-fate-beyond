name: hogwarts-fate-beyond

services:
  postgres:
    image: postgres
    container_name: hogwarts-fate-beyond-postgres
    environment:
      POSTGRES_DB: hogwarts-fate-beyond
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - hogwarts-fate-beyond_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  hogwarts-fate-beyond_postgres_data:
